name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - cursor/**

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      RETELL_GATE_STRICT_NO_DATA: "false"
      RETELL_GATE_MIN_READINESS: "85"
      RETELL_GATE_MIN_CALLS: "10"
      RETELL_GATE_MAX_BELOW_TARGET_PCT: "35"
      RETELL_GATE_MAX_TOP_RISK_PCT: "45"
      RETELL_GATE_WINDOW: "50"
      RETELL_GATE_BASE_URL: ${{ secrets.RETELL_GATE_BASE_URL }}
      RETELL_GATE_TOKEN: ${{ secrets.RETELL_GATE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run check

      - name: Retell quality gate
        run: npm run quality:retell-gate
